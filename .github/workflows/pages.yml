name: Publish Gym Leader DNA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official images
        run: python3 download-assets.py
      - name: Validate quiz and image data
        run: node test.mjs
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir _site
          cp *.html *.css *.js *.mjs *.json .nojekyll _site/
          cp -r assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
